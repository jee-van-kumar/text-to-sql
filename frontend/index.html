<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>sql console — text-to-SQL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-mark">sql</span><span class="topbar-mark topbar-mark--accent">console</span>
      <span class="topbar-sub">schema + question → SQL, generated by a fine-tuned TinyLlama-1.1B</span>
    </div>
    <div class="topbar-right">
      <span class="status-dot" id="statusDot" aria-hidden="true"></span>
      <span id="statusText">checking model…</span>
    </div>
  </header>

  <main class="console">

    <section class="pane pane--input" aria-labelledby="inputHeading">
      <h2 id="inputHeading" class="pane-heading">Query</h2>

      <div class="field">
        <label for="schema">Schema</label>
        <textarea id="schema" spellcheck="false" placeholder="CREATE TABLE employees (id INT, name TEXT, department TEXT, salary INT);"></textarea>
      </div>

      <div class="field">
        <label for="question">Question</label>
        <textarea id="question" spellcheck="false" placeholder="List the names of employees in the Engineering department earning more than 100000."></textarea>
      </div>

      <div class="examples">
        <span class="examples-label">Try an example</span>
        <button class="chip" data-example="employees">employees</button>
        <button class="chip" data-example="orders">orders</button>
        <button class="chip" data-example="movies">movies</button>
      </div>

      <button id="runBtn" class="run-btn">
        <span id="runBtnLabel">Generate SQL</span>
      </button>
    </section>

    <section class="pane pane--output" aria-labelledby="outputHeading">
      <div class="output-header">
        <h2 id="outputHeading" class="pane-heading">Generated SQL</h2>
        <div class="output-meta" id="outputMeta"></div>
      </div>

      <div class="sql-block" id="sqlBlock">
        <pre id="sqlOutput" class="sql-output"><code>-- output will appear here</code></pre>
      </div>

      <div class="output-actions">
        <button id="copyBtn" class="copy-btn" disabled>Copy</button>
        <span id="errorText" class="error-text" role="alert"></span>
      </div>
    </section>

  </main>

  <footer class="footer">
    <span>Served from <code>/generate</code> on this FastAPI instance.</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
